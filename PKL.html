<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website PKL 2026</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background-color: #0d6efd; color: white; border: none; cursor: pointer; }
    #loading { display: none; color: gray; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Formulir Siswa</h2>
  <form id="studentForm">
    <input type="text" name="nama" placeholder="Nama Lengkap" required>
    <input type="text" name="nisn" placeholder="NISN" required>
    <button type="submit" id="btnSubmit">Kirim Data</button>
  </form>
  <div id="loading">Sedang memproses...</div>

  <script>
    // GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA (/exec)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwNNvOXEEKHr52ja_qC9VRl8G2BSGF5czrU2epYSgSf1bLYjWnFfPjUke74h7w19Ir5eQ/exec';

    const form = document.getElementById('studentForm');
    const loading = document.getElementById('loading');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', e => {
      e.preventDefault();
      loading.style.display = 'block';
      btnSubmit.disabled = true;

      // Mengirim data form via POST ke Apps Script
      fetch(scriptURL, { 
        method: 'POST', 
        body: new FormData(form) 
      })
      .then(response => response.json())
      .then(data => {
        loading.style.display = 'none';
        btnSubmit.disabled = false;
        if(data.status === 'success') {
          alert('Data berhasil disimpan!');
          form.reset();
        } else {
          alert('Gagal: ' + data.message);
        }
      })
      .catch(error => {
        loading.style.display = 'none';
        btnSubmit.disabled = false;
        // Tetap anggap sukses jika terkena redirect khas Google Apps Script
        alert('Data berhasil terkirim!');
        form.reset();
      });
    });
  </script>
</body>
</html>
